[project]
name = "opspilot-backend"
version = "0.1.0"
description = "Human-approved infrastructure capacity platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT>=2.9,<3.0",
  "slowapi>=0.1.9,<1.0",
  "email-validator>=2.2,<3.0",
  "prometheus-client>=0.21,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "integration_tests"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "pytest-cov>=5.0,<7.0", "httpx>=0.27,<1.0", "ruff>=0.8,<1.0"]
