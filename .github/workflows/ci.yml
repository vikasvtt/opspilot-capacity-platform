name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: opspilot
          POSTGRES_PASSWORD: opspilot
          POSTGRES_DB: opspilot_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U opspilot -d opspilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OPSPILOT_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot_test
      TEST_DATABASE_URL: postgresql+psycopg://opspilot:opspilot@localhost:5432/opspilot_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[dev]'
        working-directory: backend
      - run: ruff check app tests integration_tests alembic
        working-directory: backend
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t opspilot-backend ./backend
      - run: docker build -t opspilot-frontend ./frontend
      - run: docker build -f monitoring/Dockerfile.prometheus -t opspilot-prometheus ./monitoring
      - run: docker build -t opspilot-grafana ./monitoring/grafana
      - run: docker compose config --quiet
